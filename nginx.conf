# Static host for the Godot web export: correct .wasm/.pck types, and the
# pre-gzipped artefacts served straight off disk (only the .gz is committed).
types {
    text/html                 html;
    application/wasm          wasm;
    application/octet-stream  pck;
    text/javascript           js;
    image/png                 png;
    image/svg+xml             svg;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip_static always;
    gunzip on;
    gzip_proxied any;   # Caddy adds a Via header; without this nginx skips the .gz

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location ~* \.(wasm|pck|js|png|svg)$ {
        add_header Cache-Control "public, max-age=3600";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
